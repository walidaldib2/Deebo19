name: Build DEEB Android APK
# Rebuild after the latest branch-report layout and readability updates.

on:
  workflow_dispatch:
  pull_request:
    branches:
      - feature/deboo-pro-upgrade
  push:
    branches:
      - feature/deboo-pro-upgrade
      - feature/stronger-print-reports
      - fix/daily-report-blank-pages-2026-11-23

concurrency:
  group: deeb-android-apk-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/fix/daily-report-blank-pages-2026-11-23' }}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: npm install

      - name: Run project checks
        run: |
          npm test
          node --check app.js
          node --check db.js
          node --check qrcode.js
          node --check sw.js
          node --check prepare-android.js
          node --check configure-android-share.js
          node --check prepare-android-icons.js
          node --check configure-android-file-export.js
          node --check configure-android-instrumentation.js
          node --check preferences.js
          node --check native-plugins-entry.js
          node --check biometric-entry.js

      - name: Install Chromium and PDF inspection tools
        run: |
          npx --yes playwright install --with-deps chromium
          sudo apt-get update
          sudo apt-get install -y poppler-utils

      - name: Render production daily report HTML to PDF
        run: |
          node written-report-pdf-fixture.js "$RUNNER_TEMP/deeb-daily-report.html"
          CHROME="$(find "$HOME/.cache/ms-playwright" -type f \( -path '*/chrome-linux/chrome' -o -path '*/chrome-linux64/chrome' \) | head -n 1)"
          test -n "$CHROME"
          "$CHROME" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage --no-pdf-header-footer --print-to-pdf="$RUNNER_TEMP/deeb-daily-report.pdf" "file://$RUNNER_TEMP/deeb-daily-report.html"
          pdfinfo "$RUNNER_TEMP/deeb-daily-report.pdf"
          pdftotext -layout "$RUNNER_TEMP/deeb-daily-report.pdf" "$RUNNER_TEMP/deeb-daily-report.txt"
          python3 - <<'PY'
          from pathlib import Path
          import os
          text = Path(os.environ["RUNNER_TEMP"] + "/deeb-daily-report.txt").read_text(encoding="utf-8")
          pages = [page.strip() for page in text.split("\f") if page.strip()]
          if len(pages) < 2 or len(pages) > 12:
              raise SystemExit(f"Unexpected daily-report PDF page count: {len(pages)}")
          markers = ("REPORT_BODY_PAGE_SENTINEL", "LONG_REPORT_START_SENTINEL", "SECOND_REPORT_CONTENT_SENTINEL")
          for number, page in enumerate(pages, 1):
              if not any(marker in page for marker in markers):
                  raise SystemExit(f"PDF page {number} appears blank or contains no report body text.")
          combined = "\n".join(pages)
          for marker in ("LONG_REPORT_END_SENTINEL", "SECOND_REPORT_CONTENT_SENTINEL"):
              if marker not in combined:
                  raise SystemExit(f"PDF output is missing required report content: {marker}")
          print(f"Daily-report Chromium PDF check passed: {len(pages)} populated pages; no blank pages detected.")
          PY

      - name: Prepare web assets
        run: npm run prepare:android

      - name: Build biometric web bundle
        run: npm run build:biometric

      - name: Build native plugin bridge
        run: npm run build:native-plugins

      - name: Verify Android web assets
        run: |
          test -s www/index.html
          test -s www/biometric.bundle.js
          test -s www/native-plugins.bundle.js
          grep -q 'FileExport' native-plugins-entry.js
          grep -q "BiometricAuth" www/biometric.bundle.js

      - name: Generate Android project
        run: npx cap add android

      - name: Generate DEEB Android launcher and Play Store icons
        run: |
          npm run prepare:android:icons
          test -s play-store-assets/icon-512.png

      - name: Sync Android project
        run: npx cap sync android

      - name: Configure native WhatsApp share receiver
        run: npm run configure:android:share

      - name: Install native report print and image export plugin
        run: node configure-android-file-export.js

      - name: Configure Android WebView export instrumentation tests
        run: node configure-android-instrumentation.js

      - name: Verify Play Store Android configuration
        env:
          APP_VERSION: ${{ github.run_number }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json, os, re
          variables = Path("android/variables.gradle").read_text(encoding="utf-8")
          for key in ("compileSdkVersion", "targetSdkVersion"):
              match = re.search(rf"\b{key}\s*=\s*(\d+)", variables)
              if not match or int(match.group(1)) < 36:
                  raise SystemExit(f"{key} must be at least 36 for Google Play")
          package = json.loads(Path("package.json").read_text(encoding="utf-8"))
          gradle = Path("android/app/build.gradle")
          source = gradle.read_text(encoding="utf-8")
          source, code_count = re.subn(r"versionCode\s+\d+", f"versionCode {int(os.environ['APP_VERSION'])}", source, count=1)
          source, name_count = re.subn(r'versionName\s+"[^"]+"', f'versionName "{package["version"]}"', source, count=1)
          if code_count != 1 or name_count != 1:
              raise SystemExit("Could not set Android versionCode/versionName")
          gradle.write_text(source, encoding="utf-8")
          print(f"Verified target API 36+; versionCode={os.environ['APP_VERSION']}, versionName={package['version']}")
          PY

      - name: Configure Play upload signing when keystore secrets are available
        env:
          DEEB_UPLOAD_KEYSTORE_BASE64: ${{ secrets.DEEB_UPLOAD_KEYSTORE_BASE64 }}
          DEEB_UPLOAD_STORE_PASSWORD: ${{ secrets.DEEB_UPLOAD_STORE_PASSWORD }}
          DEEB_UPLOAD_KEY_ALIAS: ${{ secrets.DEEB_UPLOAD_KEY_ALIAS }}
          DEEB_UPLOAD_KEY_PASSWORD: ${{ secrets.DEEB_UPLOAD_KEY_PASSWORD }}
        run: |
          python3 - <<'PY'
          import base64, os, re
          from pathlib import Path
          names = ["DEEB_UPLOAD_KEYSTORE_BASE64", "DEEB_UPLOAD_STORE_PASSWORD", "DEEB_UPLOAD_KEY_ALIAS", "DEEB_UPLOAD_KEY_PASSWORD"]
          values = {name: os.environ.get(name, "") for name in names}
          if not any(values.values()):
              print("No upload keystore configured; the AAB will be built unsigned for validation only.")
              raise SystemExit(0)
          missing = [name for name, value in values.items() if not value]
          if missing:
              raise SystemExit("Missing GitHub Actions secrets: " + ", ".join(missing))
          encoded = "".join(values["DEEB_UPLOAD_KEYSTORE_BASE64"].split())
          key_bytes = base64.b64decode(encoded, validate=True)
          if len(key_bytes) < 512:
              raise SystemExit("Upload keystore content is unexpectedly small.")
          key_path = Path("android/app/deeb-upload-key.jks")
          key_path.write_bytes(key_bytes)
          gradle = Path("android/app/build.gradle")
          source = gradle.read_text(encoding="utf-8")
          signing = '''
              signingConfigs {
                  release {
                      storeFile file("deeb-upload-key.jks")
                      storePassword System.getenv("DEEB_UPLOAD_STORE_PASSWORD")
                      keyAlias System.getenv("DEEB_UPLOAD_KEY_ALIAS")
                      keyPassword System.getenv("DEEB_UPLOAD_KEY_PASSWORD")
                  }
              }
          '''
          source, count = re.subn(r"(\n\s*)buildTypes\s*\{", lambda m: m.group(1) + signing + "\n    buildTypes {", source, count=1)
          if count != 1:
              key_path.unlink(missing_ok=True)
              raise SystemExit("Could not add the Android release signing configuration.")
          source, count = re.subn(r"(\n\s*buildTypes\s*\{\s*\n\s*release\s*\{)", r"\1\n            signingConfig signingConfigs.release", source, count=1)
          if count != 1:
              key_path.unlink(missing_ok=True)
              raise SystemExit("Could not attach upload signing to the release build type.")
          gradle.write_text(source, encoding="utf-8")
          print("Play upload signing configured. Keystore remains outside Git and will be removed after packaging.")
          PY

      - name: Configure Maven Central mirrors
        run: |
          python3 - <<'PY'
          from pathlib import Path
          primary = 'maven { url "https://maven-central.storage-download.googleapis.com/maven2" }'
          fallback = 'maven { url "https://repo1.maven.org/maven2" }'
          for path in Path("android").rglob("*.gradle"):
              source = path.read_text(encoding="utf-8")
              # Replace mavenCentral() itself so Gradle cannot fall through to
              # repo.maven.apache.org when that endpoint rate-limits CI.
              source = source.replace("mavenCentral()", primary + "\n        " + fallback)
              if primary not in source and "repositories {" in source:
                  source = source.replace("repositories {", "repositories {\n        " + primary + "\n        " + fallback, 1)
              path.write_text(source, encoding="utf-8")
          PY

      - name: Build debug APK
        timeout-minutes: 20
        working-directory: android
        run: |
          chmod +x gradlew
          for attempt in 1 2 3; do
            if ./gradlew assembleDebug --no-daemon --no-configuration-cache --max-workers=2 --console=plain --stacktrace; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "Gradle build failed (possibly temporary Maven rate limiting). Retrying in $((attempt * 30)) seconds..."
              sleep $((attempt * 30))
            fi
          done
          exit 1

      - name: Run Android emulator report image export test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: cd android && ./gradlew connectedDebugAndroidTest --no-daemon --no-configuration-cache --max-workers=2 --console=plain --stacktrace

      - name: Upload installable debug APK immediately
        uses: actions/upload-artifact@v4
        with:
          name: DEEB-Android-Debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Build Play Store Android App Bundle
        timeout-minutes: 20
        working-directory: android
        env:
          DEEB_UPLOAD_STORE_PASSWORD: ${{ secrets.DEEB_UPLOAD_STORE_PASSWORD }}
          DEEB_UPLOAD_KEY_ALIAS: ${{ secrets.DEEB_UPLOAD_KEY_ALIAS }}
          DEEB_UPLOAD_KEY_PASSWORD: ${{ secrets.DEEB_UPLOAD_KEY_PASSWORD }}
        run: ./gradlew bundleRelease --no-daemon --no-configuration-cache --max-workers=2 --console=plain --stacktrace

      - name: Verify bundle signature and remove upload key
        if: always()
        env:
          DEEB_UPLOAD_KEYSTORE_BASE64: ${{ secrets.DEEB_UPLOAD_KEYSTORE_BASE64 }}
        run: |
          bundle="android/app/build/outputs/bundle/release/app-release.aab"
          if [ -f "$bundle" ] && [ -n "$DEEB_UPLOAD_KEYSTORE_BASE64" ]; then
            jarsigner -verify -certs "$bundle"
          elif [ -f "$bundle" ]; then
            echo "AAB is unsigned; configure the four DEEB_UPLOAD_* GitHub secrets before Play Console upload."
          fi
          rm -f android/app/deeb-upload-key.jks

      - name: Upload APK and Play Store bundle
        uses: actions/upload-artifact@v4
        with:
          name: DEEB-Android-Release-Candidates
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/bundle/release/app-release.aab
            play-store-assets/icon-512.png
          if-no-files-found: error
          retention-days: 30
