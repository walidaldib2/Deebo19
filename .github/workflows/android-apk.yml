name: Build DEBOO16 Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - feature/deboo-pro-upgrade

concurrency:
  group: deboo16-android-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: npm install

      - name: Run project checks
        run: |
          npm test
          node --check app.js
          node --check db.js
          node --check qrcode.js
          node --check sw.js
          node --check prepare-android.js
          node --check configure-android-share.js

      - name: Prepare web assets
        run: npm run prepare:android

      - name: Build biometric web bundle
        run: npm run build:biometric

      - name: Verify Android web assets
        run: |
          test -s www/index.html
          test -s www/biometric.bundle.js
          grep -q "BiometricAuth" www/biometric.bundle.js

      - name: Generate Android project
        run: npx cap add android

      - name: Sync Android project
        run: npx cap sync android

      - name: Configure native WhatsApp share receiver
        run: npm run configure:android:share

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          for attempt in 1 2 3; do
            if ./gradlew assembleDebug --no-daemon --max-workers=2; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "Gradle build failed (possibly temporary Maven rate limiting). Retrying in $((attempt * 30)) seconds..."
              sleep $((attempt * 30))
            fi
          done
          exit 1

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DEBOO16-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
