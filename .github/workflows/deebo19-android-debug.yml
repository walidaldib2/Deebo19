name: Build DEEB19 Android debug APK

on:
  workflow_dispatch:
  push:
    branches:
      - feature/deebo-team-sync-f378-2026-11-25

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout isolated DEEB19 development branch
        uses: actions/checkout@v4
        with:
          ref: feature/deebo-team-sync-f378-2026-11-25

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm install

      - name: Run all DEEB19 regression tests
        run: npm test

      - name: Prepare Android web assets
        run: npm run prepare:android

      - name: Generate Android project with the DEEB19-only package ID
        run: npx cap add android

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Configure native sharing and report export
        run: npm run configure:android:share

      - name: Generate DEEB19 launcher icons
        run: npm run prepare:android:icons

      - name: Build debug APK
        run: cd android && ./gradlew --no-daemon assembleDebug

      - name: Verify APK package identity
        run: |
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n 1)/aapt" dump badging "$APK" | tee apk-badging.txt
          grep -F "package: name='com.deebo19.fieldops'" apk-badging.txt
          grep -F "application-label:'DEEB19'" apk-badging.txt

      - name: Upload installable debug APK
        uses: actions/upload-artifact@v4
        with:
          name: DEEB19-Android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
