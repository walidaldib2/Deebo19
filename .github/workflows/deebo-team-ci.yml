name: DEEB19 isolated development checks

on:
  push:
    branches:
      - feature/deebo-team-sync-f378-2026-11-25
  pull_request:
    branches:
      - feature/deebo-team-sync-f378-2026-11-25

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm test

  android-debug:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/deebo-team-sync-f378-2026-11-25
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm install
      - run: npm run prepare:android
      - run: npx cap add android
      - run: npx cap sync android
      - run: npm run configure:android:share
      - run: npm run prepare:android:icons
      - run: cd android && ./gradlew --no-daemon assembleDebug
      - name: Verify DEEB19 package identity
        run: |
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n 1)/aapt" dump badging "$APK" | tee apk-badging.txt
          grep -F "package: name='com.deebo19.fieldops'" apk-badging.txt
          grep -F "application-label:'DEEB19'" apk-badging.txt
      - uses: actions/upload-artifact@v4
        with:
          name: DEEB19-Android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
