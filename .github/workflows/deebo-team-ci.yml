name: DEEB19 isolated development checks

on:
  push:
    branches:
      - feature/deebo-team-sync-f378-2026-11-25
  pull_request:
    branches:
      - feature/deebo-team-sync-f378-2026-11-25

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm test
