
<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#050c19">
<meta name="description" content="DEEB نظام متابعة وإدارة ميدانية">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="preferences.css">
<title>DEEB | نظام المتابعة الميدانية</title>
</head>
<body>
<div class="app-shell">
<header class="masthead">
  <div class="date-box" id="todayDate">...</div>
  <div class="identity">
    <div>
      <div class="wordmark">DEEB</div>
      <div class="subtitle">نظام المتابعة والإدارة الميدانية</div>
    </div>
  </div>
</header>
<main>
<div id="authPanel" class="auth-panel hidden">
  <div class="auth-brand">
    <div><b>DEEB</b><small>قفل محلي للجهاز</small></div>
  </div>
  <p class="muted">أدخل رمز PIN لفتح التطبيق على هذا الجهاز.</p>
  <div class="form">
    <div class="field">
      <label>رمز PIN</label>
      <input id="authPassword" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="8" autocomplete="current-password" placeholder="أدخل الرمز">
    </div>
  </div>
  <div class="actions">
    <button class="primary" id="loginBtn">فتح التطبيق</button>
  </div>
  <p id="authMessage" class="muted"></p>
</div>
<div id="appRoot" class="hidden">
<section class="search-panel">
  <label for="globalSearch">🔎 البحث في التطبيق</label>
  <input id="globalSearch" type="search" placeholder="ابحث عن اسم أو فرع أو بلاغ أو مهمة...">
</section>
<section class="tiles" id="mainTiles">
  <button class="tile active" data-page="home"><span>🏠</span><b>لوحة التحكم</b></button>
  <button class="tile" data-page="operations"><span>🧭</span><b>التشغيل الميداني</b></button>
  <button class="tile" data-page="security"><span>🛡️</span><b>إدارة الأمن</b></button>
  <button class="tile" data-page="assignments"><span>📝</span><b>التكليفات والمتابعة</b></button>
  <button class="tile" data-page="reports"><span>📋</span><b>التقارير</b></button>
  <button class="tile" data-page="settings"><span>⚙️</span><b>إدارة النظام</b></button>
</section>
<section class="stories">
  <div class="section-title"><span></span><h2>DEEB Stories</h2><span></span></div>
  <div class="story-grid">
    <button class="story-card" data-page="follow">
      <span class="story-number" id="followCount">0</span>
      <b>متابعات الشفت</b><small>سجل المرور والمتابعة</small>
    </button>
    <button class="story-card" data-page="settings">
      <span class="story-number" id="branchCount">0</span>
      <b>الفروع المسجلة</b><small>إدارة البيانات من الإعدادات</small>
    </button>
  </div>
</section>
<section id="contentArea" class="content-area"></section>
</div>
</main>
<footer class="footer"><span>DEEB</span> • FIELD OPERATIONS MANAGEMENT</footer>
</div>
<div id="toast" class="toast"></div>
<script>
(() => {
  "use strict";
  let shown = false;
  function startupFailure(message) {
    if (shown) return;
    const root = document.getElementById("appRoot");
    const panel = document.getElementById("authPanel");
    if (root && !root.classList.contains("hidden")) return;
    shown = true;
    if (root) root.classList.add("hidden");
    if (panel) {
      panel.classList.remove("hidden");
      panel.innerHTML = '<div class="auth-brand"><div><b>DEEB</b><small>تعذر تشغيل التطبيق</small></div></div><p class="muted" style="white-space:pre-wrap;overflow-wrap:anywhere"></p><button class="primary" type="button" id="startupRetry">إعادة المحاولة</button>';
      panel.querySelector("p").textContent = message;
      panel.querySelector("#startupRetry").addEventListener("click", () => location.reload());
    }
  }
  window.addEventListener("error", event => {
    const target = event.target;
    if (target && target.tagName === "SCRIPT") {
      startupFailure("تعذر تحميل ملف التطبيق: " + (target.src || "ملف JavaScript"));
    } else if (event.message) {
      startupFailure("خطأ أثناء تشغيل التطبيق: " + event.message);
    }
  }, true);
  window.addEventListener("unhandledrejection", event => {
    startupFailure("تعذر بدء التطبيق: " + String(event.reason?.message || event.reason || "خطأ غير معروف"));
  });
  window.setTimeout(() => {
    const root = document.getElementById("appRoot");
    const panel = document.getElementById("authPanel");
    if (root?.classList.contains("hidden") && panel?.classList.contains("hidden")) {
      startupFailure("لم تكتمل تهيئة التطبيق. أعد المحاولة، وإذا استمرت المشكلة أرسل صورة هذه الرسالة.");
    }
  }, 15000);
})();
</script>
<script src="qrcode.js"></script>
<script src="db.js"></script>
<script src="biometric.bundle.js"></script>
<script src="native-plugins.bundle.js"></script>
<script src="app.js"></script>
<script src="preferences.js"></script>
</body>
</html>
