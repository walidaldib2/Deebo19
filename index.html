
<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#050c19">
<meta name="description" content="DEBOO16 نظام متابعة وإدارة ميدانية">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="preferences.css">
<title>DEBOO16 | نظام المتابعة الميدانية</title>
</head>
<body>
<div class="app-shell">
<header class="masthead">
  <div class="date-box" id="todayDate">...</div>
  <div class="identity">
    <img class="wolf-mark" src="icon.svg" alt="شعار الذئب">
    <div>
      <div class="wordmark">DEBOO16</div>
      <div class="subtitle">نظام المتابعة والإدارة الميدانية</div>
    </div>
  </div>
</header>
<main>
<div id="authPanel" class="auth-panel hidden">
  <div class="auth-brand">
    <img src="icon.svg" alt="">
    <div><b>DEBOO16</b><small>قفل محلي للجهاز</small></div>
  </div>
  <p class="muted">أدخل رمز PIN لفتح التطبيق على هذا الجهاز.</p>
  <div class="form">
    <div class="field">
      <label>رمز PIN</label>
      <input id="authPassword" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="8" autocomplete="current-password" placeholder="أدخل الرمز">
    </div>
  </div>
  <div class="actions">
    <button class="primary" id="loginBtn">فتح التطبيق</button>
  </div>
  <p id="authMessage" class="muted"></p>
</div>
<div id="appRoot" class="hidden">
<section class="search-panel">
  <label for="globalSearch">🔎 البحث في التطبيق</label>
  <input id="globalSearch" type="search" placeholder="ابحث عن اسم أو فرع أو بلاغ أو مهمة...">
</section>
<section class="tiles" id="mainTiles">
  <button class="tile active" data-page="home"><span>🏠</span><b>الرئيسية</b></button>
  <button class="tile" data-page="follow"><span>📞</span><b>المتابعة</b></button>
  <button class="tile" data-page="emergency"><span>🚨</span><b>الطوارئ</b></button>
  <button class="tile" data-page="reports"><span>📋</span><b>التقارير</b></button>
  <button class="tile" data-page="settings"><span>⚙️</span><b>الإعدادات</b></button>
</section>
<section class="stories">
  <div class="section-title"><span></span><h2>DEBOO Stories</h2><span></span></div>
  <div class="story-grid">
    <button class="story-card" data-page="follow">
      <span class="story-number" id="followCount">0</span>
      <b>متابعات الشفت</b><small>سجل المرور والمتابعة</small>
    </button>
    <button class="story-card" data-page="settings">
      <span class="story-number" id="branchCount">0</span>
      <b>الفروع المسجلة</b><small>إدارة البيانات من الإعدادات</small>
    </button>
  </div>
</section>
<section id="contentArea" class="content-area"></section>
</div>
</main>
<footer class="footer"><span>DEBOO16</span> • FIELD OPERATIONS MANAGEMENT</footer>
</div>
<div id="toast" class="toast"></div>
<script src="qrcode.js"></script>
<script src="db.js"></script>
<script src="biometric.bundle.js"></script>
<script src="app.js"></script>
<script src="preferences.js"></script>
</body>
</html>
