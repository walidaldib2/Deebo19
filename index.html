
<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#050c19">
<meta name="description" content="DEEB نظام متابعة وإدارة ميدانية">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="preferences.css">
<title>DEEB19 | نظام المتابعة الميدانية</title>
</head>
<body>
<div class="app-shell">
<header class="masthead">
  <div class="date-box" id="todayDate">...</div>
  <div class="identity">
    <div>
      <div class="wordmark">DEEB19</div>
      <div class="subtitle">نظام المتابعة والإدارة الميدانية</div>
    </div>
  </div>
</header>
<main>
<div id="authPanel" class="auth-panel hidden">
  <div class="auth-brand">
    <div><b>DEEB19</b><small>قفل محلي للجهاز</small></div>
  </div>
  <p class="muted">أدخل رمز PIN لفتح التطبيق على هذا الجهاز.</p>
  <div class="form">
    <div class="field">
      <label>رمز PIN</label>
      <input id="authPassword" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="8" autocomplete="current-password" placeholder="أدخل الرمز">
    </div>
  </div>
  <div class="actions">
    <button class="primary" id="loginBtn">فتح التطبيق</button>
  </div>
  <p id="authMessage" class="muted"></p>
</div>
<div id="appRoot" class="hidden">
<section class="search-panel">
  <label for="globalSearch">🔎 البحث في التطبيق</label>
  <input id="globalSearch" type="search" placeholder="ابحث عن اسم أو فرع أو بلاغ أو مهمة...">
</section>
<section class="tiles" id="mainTiles">
  <button class="tile active" data-page="home"><svg class="tile-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z"/></svg><b>لوحة التحكم</b></button>
  <button class="tile" data-page="operations"><svg class="tile-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 22s8-4 8-11V5l-8-3-8 3v6c0 7 8 11 8 11Z"/><path d="m9 12 2 2 4-4"/></svg><b>التشغيل الميداني</b></button>
  <button class="tile" data-page="security"><svg class="tile-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 22s8-4 8-11V5l-8-3-8 3v6c0 7 8 11 8 11Z"/><path d="M12 8v8m-4-4h8"/></svg><b>إدارة الأمن</b></button>
    <button class="tile" data-page="reportsGroup"><svg class="tile-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 19V5m0 14h16"/><path d="m7 15 4-4 3 2 5-6"/></svg><b>التقارير والسجلات</b></button>
  <button class="tile" data-page="system"><svg class="tile-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="m19.4 15 .1.1 1.4 1.1-1.4 2.4-1.7-.6a8 8 0 0 1-1.7 1l-.3 1.8h-2.8l-.3-1.8a8 8 0 0 1-1.7-1l-1.7.6-1.4-2.4 1.4-1.1a8 8 0 0 1 0-2l-1.4-1.1 1.4-2.4 1.7.6a8 8 0 0 1 1.7-1l.3-1.8h2.8l.3 1.8a8 8 0 0 1 1.7 1l1.7-.6 1.4 2.4-1.4 1.1a8 8 0 0 1 0 2Z"/></svg><b>البيانات والإعدادات</b></button>
</section>

<section id="contentArea" class="content-area"></section>
</div>
</main>
<footer class="footer"><span>DEEB</span> • FIELD OPERATIONS MANAGEMENT</footer>
</div>
<div id="toast" class="toast"></div>
<script>
(() => {
  "use strict";
  let shown = false;
  function startupFailure(message) {
    if (shown) return;
    const root = document.getElementById("appRoot");
    const panel = document.getElementById("authPanel");
    if (root && !root.classList.contains("hidden")) return;
    shown = true;
    if (root) root.classList.add("hidden");
    if (panel) {
      panel.classList.remove("hidden");
      panel.innerHTML = '<div class="auth-brand"><div><b>DEEB</b><small>تعذر تشغيل التطبيق</small></div></div><p class="muted" style="white-space:pre-wrap;overflow-wrap:anywhere"></p><button class="primary" type="button" id="startupRetry">إعادة المحاولة</button>';
      panel.querySelector("p").textContent = message;
      panel.querySelector("#startupRetry").addEventListener("click", () => location.reload());
    }
  }
  window.addEventListener("error", event => {
    const target = event.target;
    if (target && target.tagName === "SCRIPT") {
      startupFailure("تعذر تحميل ملف التطبيق: " + (target.src || "ملف JavaScript"));
    } else if (event.message) {
      const location = event.filename
        ? "\\nالملف: " + event.filename.split("/").pop() + "\\nالسطر: " + (event.lineno || "?") + " — العمود: " + (event.colno || "?")
        : "";
      startupFailure("خطأ أثناء تشغيل التطبيق: " + event.message + location);
    }
  }, true);
  window.addEventListener("unhandledrejection", event => {
    startupFailure("تعذر بدء التطبيق: " + String(event.reason?.message || event.reason || "خطأ غير معروف"));
  });
  window.setTimeout(() => {
    const root = document.getElementById("appRoot");
    const panel = document.getElementById("authPanel");
    if (root?.classList.contains("hidden") && panel?.classList.contains("hidden")) {
      startupFailure("لم تكتمل تهيئة التطبيق. أعد المحاولة، وإذا استمرت المشكلة أرسل صورة هذه الرسالة.");
    }
  }, 15000);
})();
</script>
<script src="qrcode.js"></script>
<script src="db.js"></script>
<script src="team-sync.js"></script>
<script src="biometric.bundle.js"></script>
<script src="native-plugins.bundle.js"></script>
<script src="app.js"></script>
<script src="preferences.js"></script>
</body>
</html>
